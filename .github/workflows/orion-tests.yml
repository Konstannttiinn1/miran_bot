name: Orion Python tests
on:
  push:
    branches:
      - feat/dealer-catalog-phase1-20261124
      - feat/dealer-catalog-phase2-checkout-20261124
  pull_request:
    branches:
      - feat/manual-broadcasts-20261119
      - feat/dealer-catalog-phase1-20261124
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run full test suite
        run: python -m pytest -q
